<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Markdown Notes Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Markdown Notes Lab</h1>
      <p>Local browser storage. Export a backup before clearing browser data.</p>
      <p id="status" role="status">Loading notes…</p>
      <div class="actions">
        <button id="new-note">New note</button><button id="save">Save now</button
        ><button id="export">Export all drafts</button
        ><label class="file"
          >Import JSON<input type="file" id="import" accept="application/json,.json"
        /></label>
      </div>
    </header>
    <div class="layout">
      <aside>
        <label>Search title, text or tags<input id="search" type="search" /></label
        ><label
          >Exact tag filter<select id="tag-filter">
            <option value="">All tags</option>
          </select></label
        >
        <ul id="note-list"></ul>
      </aside>
      <main>
        <fieldset id="fields" disabled>
          <legend>Note editor</legend>
          <label>Title<input id="title" maxlength="200" /></label
          ><label>Tags, separated by commas<input id="tags" maxlength="820" /></label
          ><label>Markdown<textarea id="editor" rows="14" maxlength="20000"></textarea></label
          ><button id="delete">Delete selected note</button>
        </fieldset>
        <h2>Live preview</h2>
        <div id="preview"></div>
      </main>
    </div>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
