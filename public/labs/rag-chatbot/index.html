<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Document Q&A lab</title>
  <main>
    <h1>Document Q&A lab</h1>
    <p>
      Default: offline lexical retrieval and quoted evidence. No LLM. External mode is explicitly
      labeled.
    </p>
    <form>
      <label>Question <input name="question" required maxlength="1000" size="35" /></label
      ><button>Ask</button>
    </form>
    <p role="status"></p>
    <pre id="answer"></pre>
    <section aria-label="Retrieved source passages" id="sources"></section>
  </main>
  <script src="/client.js"></script>
</html>
