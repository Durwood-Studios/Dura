name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  standards-gate:
    name: Standards Conformance Gate (AINDGS / LFLRS / PPLAS)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Need history for the AI-provenance commit walk
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: AINDGS-R1 — CLAUDE.md required sections
        run: npm run check:claude-md

      - name: LFLRS-R2 — schema self-validity + sample fixture
        run: npm run check:lflrs-schema

      - name: PPLAS-R5 — every track() event matches the catalog
        run: npm run check:analytics-catalog

      - name: AINDGS-R3 — AI provenance tags on high-risk-path commits
        run: npm run check:ai-provenance

      - name: LFLRS / xAPI — Vitest learner-record suite
        run: npx vitest run tests/learner-record

  browser-tests:
    name: Browser learning and offline flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production browser tests
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database-contracts:
    name: Staged database contracts and row policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: dura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dura_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Check migrations and row isolation in a disposable database
        env:
          DURA_TEST_DATABASE_URL: postgres://postgres:local-test-only@localhost:5432/dura_test
        run: bash scripts/check-staged-supabase.sh
