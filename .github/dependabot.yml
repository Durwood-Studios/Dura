# Dependabot — weekly dependency updates.
#
# Rationale: the 2026-05-27 security sweep found 13 advisories against Next.js
# alone because dependencies had drifted ~6 months behind. Automating this
# keeps the security surface tight and the audit clean.
#
# Strategy:
#   - npm ecosystem: weekly, grouped by minor/patch so PRs are reviewable
#   - github-actions: weekly, separate channel
#   - Security updates always cut their own PR regardless of schedule
#
# AINDGS-R3 / commit provenance: Dependabot commits don't need the AI-assisted
# trailer (they're not AI-generated authorship; they're dep updates). The
# commitlint custom rule (commitlint.config.mjs) only requires the trailer
# when the diff touches a CODEOWNERS-listed high-risk path, and Dependabot
# updates affect package.json + package-lock.json which aren't on that list.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 8
    versioning-strategy: increase
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    groups:
      # Bundle non-breaking updates into a single weekly PR so the review
      # burden is bounded. Major bumps still get their own PR.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Security updates cut a separate PR per package so they're easy to
      # cherry-pick and merge fast.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "build(ci)"
      include: scope
