# Issue template chooser config.
#
# `blank_issues_enabled: false` forces contributors into one of the
# structured templates (bug_report, feature_request, dictionary_term)
# so triage isn't fighting freeform paragraphs. Contact links below
# route the off-topic asks to better venues.

blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/Durwood-Studios/Dura/security/advisories/new
    about: Report a security issue privately. Do not open a public issue.

  - name: Question or discussion
    url: https://github.com/Durwood-Studios/Dura/discussions
    about: Ask a question, share an idea, or discuss the curriculum.

  - name: Code of Conduct concern
    url: mailto:conduct@durwoodstudios.com
    about: Confidential — reports go to the project owner.
